appId: com.atp.desktop
productName: 自动化测试平台
directories:
  output: release
files:
  - out/**
  - drizzle/**
  - package.json
asarUnpack:
  - node_modules/playwright-core/**
  - node_modules/playwright/**
  - "**/*.node"
dmg:
  title: 自动化测试平台
mac:
  # M1 内部分发不做签名/公证（自动更新真实生效需签名，见方案风险表）
  identity: null
  target:
    - dmg
# 更新 feed 占位：正式分发前配置（GitHub Releases 或内网 generic server）
publish:
  provider: generic
  url: https://example.com/updates/
